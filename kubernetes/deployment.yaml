apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      hostNetwork: true
      hostIPC: true
      hostPID: true
      containers:
      - name: app-container
        image: ubuntu:latest
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          runAsUser: 0
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "AKIAIOSFODNN7EXAMPLE"
        - name: AWS_SECRET_ACCESS_KEY
          value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        - name: DATABASE_URL
          value: "mysql://admin:SuperSecretPassword123!@vulnerable-db:3306/db"