apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service-app
  template:
    metadata:
      labels:
        app: api-service-app
    spec:
      containers:
      - name: api-container
        image: nginx:1.24.0
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          runAsNonRoot: false
          runAsUser: 0
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: AWS_SECRET_KEY
          value: "AKIAIOSFODNN7EXAMPLE"
        - name: DB_PASSWORD
          value: "supersecretP@ssword123!"