apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-app
  namespace: my-secure-ns
  annotations:
    checkov.io/skip1: "CKV2_K8S_6=No NetworkPolicy needed for this isolated component"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safe-app
  template:
    metadata:
      labels:
        app: safe-app
      annotations:
        checkov.io/skip1: "CKV2_K8S_6=No NetworkPolicy needed for this isolated component"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: aws-secrets-vol
          secret:
            secretName: aws-secrets
      containers:
      - name: app
        image: nginx@sha256:4424e31f2c366108433ecca7890ad527b243361577180dfd9a5bb36e828abf47
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: aws-secrets-vol
            mountPath: "/etc/aws-secrets"
            readOnly: true
        resources:
          limits:
            cpu: "500m"
            memory: "128Mi"
          requests:
            cpu: "250m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safe-app-netpol
  namespace: my-secure-ns
spec:
  podSelector:
    matchLabels:
      app: safe-app
  policyTypes:
  - Ingress
  - Egress